<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéPass - Adhésion Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="form-container">
            <div class="brand-header">
                <span class="cinema-icon">🎬</span>
                <h1>CinéPass Club</h1>
                <p>Espace officiel d'adhésion et de réservation - Saison 2025</p>
            </div>

            <form action="#" method="POST" enctype="multipart/form-data">
                
                <fieldset class="section-box">
                    <legend>1. Identité & Contact</legend>
                    <div class="grid-2col">
                        <div class="field-item">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Ex: Anis" required>
                        </div>
                        <div class="field-item">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Ex: Merad" required>
                        </div>
                        <div class="field-item">
                            <label for="email">Adresse Email</label>
                            <input type="email" id="email" name="email" placeholder="votre.mail@univ.dz" required>
                        </div>
                        <div class="field-item">
                            <label for="password">Mot de passe</label>
                            <input type="password" id="password" name="password" placeholder="8 caractères min." minlength="8" required>
                        </div>
                        <div class="field-item">
                            <label for="telephone">Téléphone</label>
                            <input type="tel" id="telephone" name="telephone" placeholder="0600000000" required>
                        </div>
                        <div class="field-item">
                            <label for="dob">Date de naissance</label>
                            <input type="date" id="dob" name="dob" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="section-box">
                    <legend>2. Formule d'Abonnement</legend>
                    <div class="field-item full-width">
                        <label>Choisissez votre pack :</label>
                        <div class="options-stack">
                            <label class="radio-label"><input type="radio" name="formule" value="basique" required> 🥉 Pack Basique - 4 séances / mois (2000 DA)</label>
                            <label class="radio-label"><input type="radio" name="formule" value="premium"> 🥈 Pack Premium - 10 séances / mois (4500 DA)</label>
                            <label class="radio-label"><input type="radio" name="formule" value="illimite"> 🥇 Pack Illimité - Accès total (7000 DA)</label>
                        </div>
                    </div>
                    <div class="grid-3col">
                        <div class="field-item">
                            <label for="date_debut">Mois de départ</label>
                            <input type="month" id="date_debut" name="date_debut" required>
                        </div>
                        <div class="field-item">
                            <label for="engagement">Engagement</label>
                            <select id="engagement" name="engagement" required>
                                <option value="">Choisir...</option>
                                <option value="3">3 Mois</option>
                                <option value="6">6 Mois (-5%)</option>
                                <option value="12">12 Mois (-10%)</option>
                            </select>
                        </div>
                        <div class="field-item">
                            <label for="accompagnants">Accompagnants</label>
                            <input type="number" id="accompagnants" name="accompagnants" min="0" value="0" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="section-box">
                    <legend>3. Préférences Cinéphiles</legend>
                    <div class="field-item full-width">
                        <label>Genres favoris :</label>
                        <div class="checkbox-grid">
                            <label><input type="checkbox" name="genres" value="action"> 💥 Action</label>
                            <label><input type="checkbox" name="genres" value="comedie"> 😄 Comédie</label>
                            <label><input type="checkbox" name="genres" value="drame"> 🎭 Drame</label>
                            <label><input type="checkbox" name="genres" value="horreur"> 👻 Thriller/Horreur</label>
                            <label><input type="checkbox" name="genres" value="scifi"> 🚀 Sci-Fi</label>
                            <label><input type="checkbox" name="genres" value="romance"> ❤️ Romance</label>
                            <label><input type="checkbox" name="genres" value="doc"> 📅 Documentaire</label>
                        </div>
                    </div>
                    <div class="grid-2col">
                        <div class="field-item">
                            <label for="langues">Langues (Ctrl+Clic multiple)</label>
                            <select id="langues" name="langues" multiple size="4" required>
                                <option value="ar">Arabe (العربية)</option>
                                <option value="fr">Français</option>
                                <option value="en">English</option>
                                <option value="es">Español</option>
                            </select>
                        </div>
                        <div class="field-item">
                            <label for="realisateur">Réalisateur fétiche</label>
                            <input type="search" id="realisateur" name="realisateur" placeholder="Ex: Christopher Nolan">
                            
                            <label for="site" style="margin-top: 10px;">Blog ou site suivi</label>
                            <input type="url" id="site" name="site" placeholder="https://allocine.fr">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="section-box">
                    <legend>4. Agenda & Paramètres</legend>
                    <div class="grid-2col">
                        <div class="field-item">
                            <label for="semaine">Semaine type préférée</label>
                            <input type="week" id="semaine" name="semaine">
                        </div>
                        <div class="field-item">
                            <label for="premiere_seance">Première séance (Date/Heure)</label>
                            <input type="datetime-local" id="premiere_seance" name="premiere_seance">
                        </div>
                        <div class="field-item">
                            <label for="horaire">Créneau horaire favori</label>
                            <input type="time" id="horaire" name="horaire">
                        </div>
                        <div class="field-item">
                            <label for="frequence">Fréquence mensuelle (visites)</label>
                            <input type="range" id="frequence" name="frequence" min="0" max="30" value="4" oninput="this.nextElementSibling.value = this.value">
                            <output style="font-weight:bold; color:#d4af37;">4</output> séances / mois
                        </div>
                        <div class="field-item full-width">
                            <label for="couleur">Thème de couleur de votre carte</label>
                            <input type="color" id="couleur" name="couleur" value="#1a1a2e">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="section-box">
                    <legend>5. Justificatifs & Message</legend>
                    <div class="field-item">
                        <label for="photo">Photo d'identité (Profil)</label>
                        <input type="file" id="photo" name="photo" accept="image/*" required>
                    </div>
                    <div class="field-item">
                        <label for="justificatif">Certificat de scolarité / Justificatif (-20%)</label>
                        <input type="file" id="justificatif" name="justificatif" accept=".pdf,.jpg,.jpeg,.png">
                    </div>
                    <div class="field-item full-width">
                        <label for="bio">Votre mot sur le cinéma :</label>
                        <textarea id="bio" name="bio" rows="3" placeholder="Pourquoi aimez-vous le 7ème art ?"></textarea>
                    </div>
                </fieldset>

                <div class="action-row">
                    <button type="submit" class="cta-button">Valider mon inscription CinéPass</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
